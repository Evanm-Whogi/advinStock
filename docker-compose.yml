services:
  stock-data-init:
    image: node:24.22.1-bookworm-slim
    user: "0:0"
    network_mode: none
    command: ["chown", "-R", "1000:1000", "/app/data"]
    volumes:
      - stock-data:/app/data

  bot:
    build: .
    container_name: advinstock-bot
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    depends_on:
      stock-data-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      STOCK_SNAPSHOT_PATH: /app/data/stock-snapshot.json
    volumes:
      - stock-data:/app/data

volumes:
  stock-data:
